[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pack-organic-price"
version = "0.1.0"
description = "Which pack to buy, and what it costs, across chemical marketplaces"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Siyun Cao"}]
keywords = ["chemistry", "procurement", "molport", "chemspace", "mcule", "smiles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.scripts]
pack-price = "packprice.cli:main"

[project.urls]
Source = "https://github.com/siyuncao/pack-organic-price"

[tool.setuptools]
packages = ["packprice"]
